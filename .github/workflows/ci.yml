name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard against root-level clutter
        run: |
          ALLOWED="vite.config.js vitest.config.js"
          STRAY_JS=$(find . -maxdepth 1 \( -name "*.js" -o -name "*.cjs" -o -name "*.mjs" \) -type f -printf "%f\n")
          for f in $STRAY_JS; do
            if ! echo "$ALLOWED" | grep -qw "$f"; then
              echo "::error::$f is a stray root-level script. Move it into scripts/ before merging."
              exit 1
            fi
          done

          STRAY_SQL=$(find . -maxdepth 1 -name "*.sql" -type f)
          if [ -n "$STRAY_SQL" ]; then
            echo "::error::SQL doesn't belong in repo root, it belongs in supabase/: $STRAY_SQL"
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --run --reporter=verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7
