    <!--
      Structured data — helps search engines understand what this is,
      can enable rich snippets. No price included: your pricing page
      still has illustrative numbers, not real ones (see the pricing
      section built earlier) — add "offers" once those are real, since
      shipping a schema price that doesn't match the visible page price
      is the kind of mismatch Search Console flags.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Termly",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Kenya's CBC-compliant school management system for finances, learner portfolios, and KNEC-standard reporting.",
      "url": "https://termly-app.vercel.app/",
      "areaServed": "KE"
    }
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        window.addEventListener('load', () => {
